<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InSAR Orchestrator docs preview</title>
<link rel="icon" type="image/svg+xml" href="/frontend/public/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
/* Local preview of the docs, served by `make docs`. Same black and green tokens as the app (frontend/src/index.css). */
:root {
  --bg: #07090a; --surface: #0e1211; --text: #eef2f0; --muted: #8a9490; --faint: #5d6663;
  --accent: #3dff9a; --accent-rgb: 61,255,154; --accent-2: #00c2a8; --warning: #ffb020; --danger: #ff5d6c;
  --border: rgba(255,255,255,0.09); --panel: rgba(255,255,255,0.035);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 15px/1.65 Figtree, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body {
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(var(--accent-rgb), 0.14), transparent 60%),
    radial-gradient(700px 500px at -5% 105%, rgba(var(--accent-rgb), 0.08), transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
header.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding: 12px clamp(16px, 4vw, 40px); background: rgba(0,0,0,0.5); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; font: 600 14px Sora, sans-serif; }
.brand img { width: 30px; height: 30px; border-radius: 9px; box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.35); }
.brand small { font: 400 11px "JetBrains Mono", monospace; color: var(--faint); margin-left: 4px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { color: var(--muted); text-decoration: none; padding: 6px 14px; border-radius: 10px; border: 1px solid transparent; font-weight: 500; font-size: 13px; }
nav a:hover { color: var(--text); background: var(--panel); }
nav a[aria-current="page"] { color: var(--accent); background: rgba(var(--accent-rgb), 0.1); border-color: rgba(var(--accent-rgb), 0.35); box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.15); }
main { max-width: 900px; margin: 0 auto; padding: 32px clamp(16px, 4vw, 40px) 80px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Rendered Markdown */
.md h1, .md h2, .md h3, .md h4 { font-family: Sora, sans-serif; letter-spacing: -0.01em; line-height: 1.25; text-wrap: balance; }
.md h1 { font-size: 30px; margin: 0 0 18px; }
.md h2 { font-size: 22px; margin: 42px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.md h3 { font-size: 17px; margin: 28px 0 10px; }
.md a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(var(--accent-rgb), 0.35); }
.md a:hover { border-bottom-color: var(--accent); }
.md img { max-width: 100%; height: auto; border-radius: 14px; border: 1px solid var(--border); display: block; margin: 14px 0; }
.md a img { border-color: var(--border); }
.md code { font: 400 0.88em "JetBrains Mono", monospace; background: rgba(255,255,255,0.07); padding: 1px 6px; border-radius: 6px; }
.md pre { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; overflow-x: auto; }
.md pre code { background: none; padding: 0; font-size: 13px; line-height: 1.55; }
.md blockquote { margin: 16px 0; padding: 4px 16px; border-left: 3px solid var(--accent); color: var(--muted); background: var(--panel); border-radius: 0 10px 10px 0; }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 34px 0; }
.md table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; display: block; overflow-x: auto; }
.md th { text-align: left; font: 500 11px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); }
.md td { padding: 9px 12px; border-top: 1px solid var(--border); vertical-align: top; }
.md ul, .md ol { padding-left: 22px; }
.md li { margin: 4px 0; }
.md li::marker { color: var(--accent); }
.notice { padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,93,108,0.35); background: rgba(255,93,108,0.08); color: var(--danger); }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="/frontend/public/logo.svg" alt="">InSAR Orchestrator <small>docs</small></div>
  <nav id="nav" aria-label="Documents"></nav>
</header>
<main id="main"></main>

<script>
const DOCS = [
  { id: "guide", title: "Guide", path: "/docs/guide.md" },
  { id: "series", title: "Reading a time series", path: "/docs/time-series-analysis.md" },
];
const nav = document.getElementById("nav");
const main = document.getElementById("main");

nav.innerHTML = DOCS.map((d) => `<a href="#${d.id}" data-id="${d.id}">${d.title}</a>`).join("");

// Relative links and images are written for GitHub, where they resolve against the Markdown file's own folder.
function resolveRelative(root, mdUrl) {
  const fix = (el, attr) => {
    const value = el.getAttribute(attr);
    if (!value || /^(https?:|#|data:|mailto:)/.test(value)) return;
    el.setAttribute(attr, new URL(value, mdUrl).pathname + new URL(value, mdUrl).hash);
  };
  root.querySelectorAll("img[src], video[src], source[src]").forEach((el) => fix(el, "src"));
  root.querySelectorAll("a[href]").forEach((el) => {
    fix(el, "href");
    const target = new URL(el.getAttribute("href"), location.origin);
    const doc = DOCS.find((d) => d.path === target.pathname);
    if (doc) el.setAttribute("href", `#${doc.id}`); // links between the docs stay inside the preview
  });
}

async function showMarkdown(doc) {
  try {
    const res = await fetch(doc.path, { cache: "no-store" });
    if (!res.ok) throw new Error(`${doc.path} answered ${res.status}`);
    const html = marked.parse(await res.text(), { gfm: true });
    main.innerHTML = `<article class="md">${html}</article>`;
    resolveRelative(main, new URL(doc.path, location.origin));
  } catch (err) {
    main.innerHTML = `<div class="notice">Could not render ${doc.path}: ${err.message}</div>`;
  }
}

function route() {
  const id = location.hash.slice(1) || "guide";
  const doc = DOCS.find((d) => d.id === id) || DOCS[0];
  nav.querySelectorAll("a").forEach((a) => (a.getAttribute("data-id") === doc.id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  document.title = `${doc.title} · InSAR Orchestrator docs`;
  window.scrollTo(0, 0);
  showMarkdown(doc);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
