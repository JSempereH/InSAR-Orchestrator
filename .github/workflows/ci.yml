name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv run --with ruff ruff check .
      - run: uv lock --check            # uv.lock matches the pyproject files

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - run: node docs/site.mjs          # a broken page or link fails here, before it reaches Pages

  insar-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv venv .venv
      - run: uv pip install --python .venv -e 'packages/insar_core[report]' -r backend/requirements-dev.txt
      - run: .venv/bin/pytest packages/insar_core/tests -q

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
      - working-directory: backend
        run: uv venv .venv
      - working-directory: backend
        run: uv pip install --python .venv -r requirements.txt -r requirements-dev.txt
      - working-directory: backend
        run: .venv/bin/pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
